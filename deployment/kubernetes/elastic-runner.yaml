apiVersion: v1
kind: Secret
metadata:
  name: favn-capacity-reader
type: Opaque
stringData:
  token: REPLACE_ME
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: favn-capacity-reader
spec:
  secretTargetRef:
    - parameter: token
      name: favn-capacity-reader
      key: token
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: favn-runner-POOL-RELEASE
spec:
  pollingInterval: 5
  minReplicaCount: 0
  maxReplicaCount: 10
  scalingStrategy:
    strategy: default
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    activeDeadlineSeconds: 10920
    template:
      metadata:
        labels:
          app.kubernetes.io/name: favn-runner
          favn.dev/runner-pool: POOL
          favn.dev/runner-release: RELEASE
      spec:
        restartPolicy: Never
        terminationGracePeriodSeconds: 120
        containers:
          - name: runner
            image: REPLACE_RUNNER_IMAGE
            env:
              - name: FAVN_CONTROL_PLANE_NODE
                value: favn-control@control-plane.favn.svc.cluster.local
              - name: FAVN_RUNNER_POOL
                value: POOL
              - name: FAVN_RUNNER_RELEASE_ID
                value: RELEASE
              - name: FAVN_RUNNER_LIFECYCLE_MODE
                value: elastic
              - name: FAVN_RUNNER_MAX_UPTIME_MS
                value: "3600000"
              - name: FAVN_RUNNER_NODE_HOST_ALIAS
                value: runner.favn.svc.cluster.local
              - name: RELEASE_COOKIE
                valueFrom:
                  secretKeyRef:
                    name: favn-distribution
                    key: cookie
              - name: FAVN_DISTRIBUTION_COOKIE
                valueFrom:
                  secretKeyRef:
                    name: favn-distribution
                    key: cookie
              - name: FAVN_DISTRIBUTION_TLS_OPTIONS_FILE
                value: /etc/favn/ssl_dist.config
              - name: ERL_AFLAGS
                value: >-
                  -proto_dist inet_tls
                  -ssl_dist_optfile /etc/favn/ssl_dist.config
            volumeMounts:
              - name: distribution-tls
                mountPath: /etc/favn
                readOnly: true
        volumes:
          - name: distribution-tls
            secret:
              secretName: favn-distribution-tls
  triggers:
    - type: metrics-api
      metadata:
        url: https://control-plane.favn.svc.cluster.local/internal/runner-demand/POOL/RELEASE
        format: json
        valueLocation: outstanding
        targetValue: "1"
        activationTargetValue: "0"
        authMode: bearer
        timeout: "2000"
      authenticationRef:
        name: favn-capacity-reader
