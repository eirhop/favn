services:
  control-plane:
    mem_limit: ${FAVN_MANIFEST_MEMORY_LIMIT:-1g}
    memswap_limit: ${FAVN_MANIFEST_MEMORY_LIMIT:-1g}

  manifest-memory-client:
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    environment:
      FAVN_PLATFORM_TOKEN: ${FAVN_PLATFORM_TOKEN}
    volumes:
      - ../../tmp:/archives:ro
      - ./manifest-memory-results:/results
    networks:
      - favn-private
    restart: "no"
