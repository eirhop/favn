  - vulnerability: CVE-2026-76642
    namespace: debian:distro:debian:13
    fix-state: wont-fix
    reason: >-
      Qualified images exclude privileged mount operations and SUID/SGID tools;
      see security/README.md for the operational limits.
    package:
      name: "^(bsdutils|libblkid1|liblastlog2-2|libmount1|libsmartcols1|libuuid1|login|mount|util-linux)$"
      type: deb
  - vulnerability: CVE-2026-78408
    namespace: debian:distro:debian:13
