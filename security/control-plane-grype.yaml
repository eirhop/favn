# Narrow reviewed exceptions for Debian 13 image findings.
# reviewed: 2026-09-01
# review-by: 2026-10-01
# Every rule includes the vendor fix state so it stops matching when a fix appears.
#
# On 2026-09-01 Debian moved the eight perl-base CVEs from not-fixed to
# wont-fix, which un-suppressed them and failed every image scan; the rules
# now pin the new state. A rule still stops matching if a fix ships.
#
# The three CVE-2026-14456 exceptions for libssl3t64, openssl, and
# openssl-provider-legacy were removed on 2026-08-26: Debian shipped the fix as
# openssl 3.5.7-1~deb13u2, so the images take the upgrade instead of the
# exception. That is the mechanism working as designed — the rules stopped
# suppressing the moment a fix existed, and the scan said so.
ignore:
  - vulnerability: CVE-2026-13221
    fix-state: wont-fix
    package:
      name: perl-base
