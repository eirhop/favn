name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect test-affecting changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            tests:
              - '**'
              - '!**/*.md'
              - '!**/README'
              - '!**/README.*'
              - '!docs/**'
              - '!apps/favn/guides/**'

  quick-checks:
    name: Quick checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0.6'

      - name: Check test tag coverage
        run: elixir scripts/check_test_tag_tiers.exs

      - name: Check for repository Python dependencies
        run: elixir scripts/check_no_repo_python.exs

      - name: Test umbrella runner
        run: elixir scripts/umbrella_test_runner_test.exs

      - name: Check removed asset DSL forms
        run: elixir scripts/check_no_legacy_asset_dsl.exs

      - name: Check removed runner architecture
        run: elixir scripts/check_no_legacy_runner_architecture.exs

      - name: Install Hex and Rebar
        run: |
          mix local.hex 2.5.1 --force
          mix local.rebar rebar3 https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3 --sha512 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36 --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run quick Elixir lint and security checks
        run: scripts/check_elixir_static_security.sh quick

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Audit dependency advisories
        run: mix deps.audit

  fast-tests:
    name: Fast tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    services:
      postgres:
        image: postgres@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: favn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d favn_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FAVN_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/favn_test
      FAVN_DATABASE_MIGRATOR_URL: ecto://postgres:postgres@127.0.0.1:5432/favn_test
      FAVN_RUNTIME_INPUT_PIN_KEY: 0123456789abcdef0123456789abcdef
      FAVN_RUNTIME_INPUT_PIN_KEY_VERSION: '1'
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0.6'

      - name: Install Hex and Rebar
        run: |
          mix local.hex 2.5.1 --force
          mix local.rebar rebar3 https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3 --sha512 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36 --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create local PostgreSQL control schema
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host 127.0.0.1 --username postgres --dbname favn_test
          --set ON_ERROR_STOP=1
          --command 'CREATE SCHEMA favn_control AUTHORIZATION postgres'

      - name: Migrate PostgreSQL Storage V2
        run: mix favn.postgres.test_setup

      - name: Build Phoenix assets
        run: |
          for attempt in 1 2 3; do
            if mix do --app favn_view cmd mix assets.build; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Test
        run: mix test --no-compile --timeout 1200000

      - name: Install pinned DuckDB ADBC driver
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-linux-amd64.zip \
            --output "$RUNNER_TEMP/libduckdb-linux-amd64.zip"
          echo "1fb8ce388157d84a25abe685a8a2520bf00c00321821968e4bb398fd766e7abb  $RUNNER_TEMP/libduckdb-linux-amd64.zip" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q "$RUNNER_TEMP/libduckdb-linux-amd64.zip" libduckdb.so -d "$RUNNER_TEMP/duckdb"

      - name: Install qualified DuckLake extension
        run: |
          curl --fail --location --silent --show-error \
            https://extensions.duckdb.org/v1.5.5/linux_amd64/ducklake.duckdb_extension.gz \
            --output "$RUNNER_TEMP/ducklake.duckdb_extension.gz"
          curl --fail --location --silent --show-error \
            https://extensions.duckdb.org/v1.5.5/linux_amd64/postgres_scanner.duckdb_extension.gz \
            --output "$RUNNER_TEMP/postgres_scanner.duckdb_extension.gz"
          echo "733ccf19fedcfd5e0bfaf85993219145181099cc411076cabf14933ea16ab452  $RUNNER_TEMP/ducklake.duckdb_extension.gz" \
            | sha256sum --check
          echo "e0f631a5535f165468bc8a20501f8bc1490adbc877d38fcdff2f8d05531e1e5b  $RUNNER_TEMP/postgres_scanner.duckdb_extension.gz" \
            | sha256sum --check
          mkdir -p "$HOME/.duckdb/extensions/v1.5.5/linux_amd64"
          gzip -dc "$RUNNER_TEMP/ducklake.duckdb_extension.gz" > "$HOME/.duckdb/extensions/v1.5.5/linux_amd64/ducklake.duckdb_extension"
          gzip -dc "$RUNNER_TEMP/postgres_scanner.duckdb_extension.gz" > "$HOME/.duckdb/extensions/v1.5.5/linux_amd64/postgres_scanner.duckdb_extension"

      - name: Test native DuckDB bootstrap and semantic compiler
        env:
          DUCKDB_ADBC_DRIVER: ${{ runner.temp }}/duckdb/libduckdb.so
          FAVN_DUCKDB_ADBC_INTEGRATION: '1'
        run: >-
          mix do --app favn_duckdb_adbc cmd mix test --no-compile
          test/sql/adapter/duckdb_adbc_integration_test.exs
          test/semantic_compiler_test.exs
          test/semantic_compiler_lifecycle_test.exs
          test/semantic_artifact_integration_test.exs
          test/relationship_checks_test.exs
          test/relationship_publication_test.exs
          test/catalog_publication_test.exs
          test/runtime_catalog_test.exs
          test/rejected_commit_retry_test.exs

      - name: Install retained DuckDB 1.5.2 Linux driver
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/duckdb/duckdb/releases/download/v1.5.2/libduckdb-linux-amd64.zip \
            --output "$RUNNER_TEMP/libduckdb-linux-amd64-v1.5.2.zip"
          echo "4711438f0fdb04f0441803409bec5430b763d4f2ac3482c1f97cfa6b5ecb4c15  $RUNNER_TEMP/libduckdb-linux-amd64-v1.5.2.zip" \
            | sha256sum --check
          mkdir -p "$RUNNER_TEMP/duckdb-v1.5.2"
          unzip -q "$RUNNER_TEMP/libduckdb-linux-amd64-v1.5.2.zip" libduckdb.so -d "$RUNNER_TEMP/duckdb-v1.5.2"

      - name: Test retained Linux semantic profile
        env:
          DUCKDB_ADBC_DRIVER: ${{ runner.temp }}/duckdb-v1.5.2/libduckdb.so
          FAVN_DUCKDB_ADBC_INTEGRATION: '1'
        run: >-
          mix do --app favn_duckdb_adbc cmd mix test --no-compile
          test/semantic_compiler_test.exs
          test/semantic_compiler_lifecycle_test.exs
          test/semantic_artifact_integration_test.exs

      - name: Build Linux semantic parity artifact
        env:
          DUCKDB_ADBC_DRIVER: ${{ runner.temp }}/duckdb/libduckdb.so
        run: mix run --no-start scripts/semantic_artifact_parity.exs -- "$RUNNER_TEMP/semantic.json"

      - name: Save Linux semantic parity artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semantic-linux-amd64
          path: ${{ runner.temp }}/semantic.json
          if-no-files-found: error

  macos-arm64:
    name: Native macOS arm64
    runs-on: macos-26
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    env:
      MIX_ENV: test
      FAVN_DATABASE_URL: ecto://favn_runtime:favn_runtime_test@127.0.0.1:55439/favn_test
      FAVN_DATABASE_MIGRATOR_URL: ecto://postgres@127.0.0.1:55439/favn_test
      FAVN_DATABASE_RUNTIME_ROLE: favn_runtime
      FAVN_RUNTIME_INPUT_PIN_KEY: 0123456789abcdef0123456789abcdef
      FAVN_RUNTIME_INPUT_PIN_KEY_VERSION: '1'
      FAVN_DUCKDB_ADBC_INTEGRATION: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert native qualification host
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 26

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0.6'

      - name: Install Hex and Rebar
        run: |
          mix local.hex 2.5.1 --force
          mix local.rebar rebar3 https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3 --sha512 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36 --force

      - name: Start native PostgreSQL 18
        run: |
          brew install postgresql@18
          echo "$(brew --prefix postgresql@18)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix postgresql@18)/bin/initdb" -D "$RUNNER_TEMP/favn-pg" -A trust -U postgres --encoding UTF8
          "$(brew --prefix postgresql@18)/bin/pg_ctl" -D "$RUNNER_TEMP/favn-pg" -o '-h 127.0.0.1 -p 55439' -w start
          "$(brew --prefix postgresql@18)/bin/createdb" -h 127.0.0.1 -p 55439 -U postgres favn_test
          "$(brew --prefix postgresql@18)/bin/psql" -h 127.0.0.1 -p 55439 -U postgres -d favn_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE favn_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'favn_runtime_test'" \
            -c 'CREATE SCHEMA favn_control AUTHORIZATION postgres' \
            -c 'REVOKE CONNECT, CREATE, TEMPORARY ON DATABASE favn_test FROM PUBLIC' \
            -c 'GRANT CONNECT ON DATABASE favn_test TO favn_runtime'

      - name: Install pinned DuckDB ADBC driver
        env:
          DUCKDB_ADBC_DRIVER: ${{ runner.temp }}/duckdb/libduckdb.dylib
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/duckdb/duckdb/releases/download/v1.5.5/libduckdb-osx-universal.zip \
            --output "$RUNNER_TEMP/libduckdb-osx-universal.zip"
          echo "7b5b8915cc382d0708636fe6385c0cdad5a61c9ff8ba2638b3e2141640783155  $RUNNER_TEMP/libduckdb-osx-universal.zip" \
            | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/duckdb"
          unzip -q "$RUNNER_TEMP/libduckdb-osx-universal.zip" libduckdb.dylib -d "$RUNNER_TEMP/duckdb"
          test "$(lipo -archs "$DUCKDB_ADBC_DRIVER")" = 'x86_64 arm64'
          echo "DUCKDB_ADBC_DRIVER=$DUCKDB_ADBC_DRIVER" >> "$GITHUB_ENV"

      - name: Install qualified DuckLake extension
        run: |
          curl --fail --location --silent --show-error \
            https://extensions.duckdb.org/v1.5.5/osx_arm64/ducklake.duckdb_extension.gz \
            --output "$RUNNER_TEMP/ducklake.duckdb_extension.gz"
          curl --fail --location --silent --show-error \
            https://extensions.duckdb.org/v1.5.5/osx_arm64/postgres_scanner.duckdb_extension.gz \
            --output "$RUNNER_TEMP/postgres_scanner.duckdb_extension.gz"
          echo "d89175054de53a830e9b2682655b640d29c9a74120f28a310fccc4bef981a0bd  $RUNNER_TEMP/ducklake.duckdb_extension.gz" \
            | shasum -a 256 --check
          echo "4fb5079e67b00e6643e6ee91545a355010004d1dad50b43f1c060de0cb789c8e  $RUNNER_TEMP/postgres_scanner.duckdb_extension.gz" \
            | shasum -a 256 --check
          mkdir -p "$HOME/.duckdb/extensions/v1.5.5/osx_arm64"
          gzip -dc "$RUNNER_TEMP/ducklake.duckdb_extension.gz" > "$HOME/.duckdb/extensions/v1.5.5/osx_arm64/ducklake.duckdb_extension"
          gzip -dc "$RUNNER_TEMP/postgres_scanner.duckdb_extension.gz" > "$HOME/.duckdb/extensions/v1.5.5/osx_arm64/postgres_scanner.duckdb_extension"

      - name: Fetch and compile
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          test -x "_build/test/lib/favn_duckdb_adbc/priv/semantic_worker"
          mix favn.postgres.test_setup --runtime-role favn_runtime

      - name: Test native semantic compilation and DuckLake
        env:
          FAVN_DATABASE_URL: ecto://postgres@127.0.0.1:55439/favn_test
        run: >-
          mix do --app favn_duckdb_adbc cmd mix test --no-compile
          test/sql/adapter/duckdb_adbc_integration_test.exs
          test/semantic_compiler_test.exs
          test/semantic_compiler_lifecycle_test.exs
          test/semantic_artifact_integration_test.exs
          test/relationship_checks_test.exs
          test/relationship_publication_test.exs
          test/catalog_publication_test.exs
          test/runtime_catalog_test.exs

      - name: Test separate-node local lifecycle
        run: >-
          mix do --app favn_local cmd mix test --no-compile --only acceptance
          test/acceptance/docker_free_local_lifecycle_test.exs

      - name: Test macOS authoring path portability
        run: >-
          mix do --app favn_authoring cmd mix test --no-compile
          test/multi_asset_portability_test.exs

      - name: Build macOS semantic parity artifact
        run: mix run --no-start scripts/semantic_artifact_parity.exs -- "$RUNNER_TEMP/semantic.json"

      - name: Save macOS semantic parity artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semantic-macos-arm64
          path: ${{ runner.temp }}/semantic.json
          if-no-files-found: error

  semantic-parity:
    name: Semantic artifact parity
    runs-on: ubuntu-latest
    needs: [fast-tests, macos-arm64]

    steps:
      - name: Fetch Linux artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: semantic-linux-amd64
          path: linux

      - name: Fetch macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: semantic-macos-arm64
          path: macos

      - name: Compare exact artifact bytes and identity
        run: |
          cmp linux/semantic.json macos/semantic.json
          sha256sum linux/semantic.json macos/semantic.json

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    env:
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0.6'

      - name: Install Hex and Rebar
        run: |
          mix local.hex 2.5.1 --force
          mix local.rebar rebar3 https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3 --sha512 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36 --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run whole-umbrella Dialyzer
        run: scripts/check_elixir_static_security.sh dialyzer

  acceptance-tests:
    name: Acceptance tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    services:
      postgres:
        image: postgres@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: favn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d favn_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FAVN_DATABASE_URL: ecto://favn_runtime:favn_runtime_test@127.0.0.1:5432/favn_test
      FAVN_DATABASE_MIGRATOR_URL: ecto://postgres:postgres@127.0.0.1:5432/favn_test
      FAVN_RUNTIME_INPUT_PIN_KEY: 0123456789abcdef0123456789abcdef
      FAVN_RUNTIME_INPUT_PIN_KEY_VERSION: '1'
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0.6'

      - name: Install Hex and Rebar
        run: |
          mix local.hex 2.5.1 --force
          mix local.rebar rebar3 https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3 --sha512 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36 --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create restricted PostgreSQL runtime role
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host 127.0.0.1 --username postgres --dbname favn_test
          --set ON_ERROR_STOP=1
          --command "CREATE ROLE favn_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'favn_runtime_test'"

      - name: Create local PostgreSQL control schema
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname favn_test \
            --set ON_ERROR_STOP=1 \
            --command 'CREATE SCHEMA favn_control AUTHORIZATION postgres' \
            --command 'REVOKE CONNECT, CREATE, TEMPORARY ON DATABASE favn_test FROM PUBLIC' \
            --command 'GRANT CONNECT ON DATABASE favn_test TO favn_runtime'

      - name: Prepare PostgreSQL Storage V2
        run: mix favn.postgres.test_setup --runtime-role favn_runtime

      - name: Run favn_local acceptance tests
        run: mix test.acceptance

  slow-tests:
    name: Slow tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    services:
      postgres:
        image: postgres@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
        env:
          POSTGRES_DB: favn_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d favn_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      FAVN_DATABASE_URL: ecto://postgres:postgres@127.0.0.1:5432/favn_test
      FAVN_DATABASE_MIGRATOR_URL: ecto://postgres:postgres@127.0.0.1:5432/favn_test
      FAVN_RUNTIME_INPUT_PIN_KEY: 0123456789abcdef0123456789abcdef
      FAVN_RUNTIME_INPUT_PIN_KEY_VERSION: '1'
      MIX_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Elixir and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: '1.20.4'
          otp-version: '29.0.6'

      - name: Install Hex and Rebar
        run: |
          mix local.hex 2.5.1 --force
          mix local.rebar rebar3 https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3 --sha512 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36 --force

      - name: Install PostgreSQL 18 client tools
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl --fail --location --silent --show-error \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Create local PostgreSQL control schema
        env:
          PGPASSWORD: postgres
        run: >-
          psql --host 127.0.0.1 --username postgres --dbname favn_test
          --set ON_ERROR_STOP=1
          --command 'CREATE SCHEMA favn_control AUTHORIZATION postgres'

      - name: Migrate PostgreSQL Storage V2
        run: mix favn.postgres.test_setup

      - name: Provision local development workspace
        env:
          FAVN_OPERATOR_COMMAND_HMAC_SECRET: ci-workspace-provisioning-hmac-secret-v1
        run: >-
          mix favn.postgres.provision_workspace
          --config .github/workspace-bootstrap.slow-tests.json

      - name: Run non-acceptance slow tests
        run: mix test.slow

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [changes, quick-checks, fast-tests, macos-arm64, semantic-parity, dialyzer, acceptance-tests, slow-tests]
    if: always()

    steps:
      - name: Check CI result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TESTS_CHANGED: ${{ needs.changes.outputs.tests }}
          QUICK_RESULT: ${{ needs.quick-checks.result }}
          FAST_RESULT: ${{ needs.fast-tests.result }}
          MACOS_RESULT: ${{ needs.macos-arm64.result }}
          PARITY_RESULT: ${{ needs.semantic-parity.result }}
          DIALYZER_RESULT: ${{ needs.dialyzer.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance-tests.result }}
          SLOW_RESULT: ${{ needs.slow-tests.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Changes job failed: $CHANGES_RESULT"
            exit 1
          fi

          if [ "$TESTS_CHANGED" != "true" ]; then
            echo "No test-affecting changes; heavy CI skipped."
            exit 0
          fi

          if [ "$QUICK_RESULT" = "success" ] && [ "$FAST_RESULT" = "success" ] && [ "$MACOS_RESULT" = "success" ] && [ "$PARITY_RESULT" = "success" ] && [ "$DIALYZER_RESULT" = "success" ] && [ "$ACCEPTANCE_RESULT" = "success" ] && [ "$SLOW_RESULT" = "success" ]; then
            echo "All CI test slices passed."
            exit 0
          fi

          echo "CI test slice failed: quick=$QUICK_RESULT fast=$FAST_RESULT macos=$MACOS_RESULT parity=$PARITY_RESULT dialyzer=$DIALYZER_RESULT acceptance=$ACCEPTANCE_RESULT slow=$SLOW_RESULT"
          exit 1
