name: Promote control-plane release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub-verified signed release tag to promote
        required: true
        type: string

concurrency:
  group: favn-control-plane-registry
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/eirhop/favn-control-plane
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  promote:
    name: Promote tested commit image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      packages: write
      attestations: read

    steps:
      - name: Validate signed release tag
        id: release_ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          tag_object_type=$(jq -r '.object.type' <<< "$tag_ref")
          tag_object_sha=$(jq -r '.object.sha' <<< "$tag_ref")
          test "$tag_object_type" = tag
          tag_record=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          test "$(jq -r '.verification.verified' <<< "$tag_record")" = true
          test "$(jq -r '.object.type' <<< "$tag_record")" = commit
          tagged_sha=$(jq -r '.object.sha' <<< "$tag_record")
          [[ "$tagged_sha" =~ ^[0-9a-f]{40,64}$ ]]

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tagged_sha=$tagged_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release_ref.outputs.release_tag }}
          fetch-depth: 0

      - name: Checkout release workflow implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-workflow
          persist-credentials: false

      - name: Validate release revision and qualification
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${RELEASE_TAG#v}
          source_version=$(scripts/release_metadata.sh | sed -n 's/^FAVN_CONTROL_PLANE_VERSION=//p')
          test "$version" = "$source_version"

          tagged_sha=$(git rev-parse --verify 'HEAD^{commit}')
          test "$tagged_sha" = "${{ steps.release_ref.outputs.tagged_sha }}"

          git fetch --no-tags origin main
          git merge-base --is-ancestor "$tagged_sha" origin/main

          successful_runs=$(gh run list --workflow CI --branch main --commit "$tagged_sha" --event push --status success --json databaseId --jq 'length')
          test "$successful_runs" -ge 1
          image_runs=$(gh run list --workflow control-plane-image.yml --branch main --commit "$tagged_sha" --event push --status success --json databaseId --jq 'length')
          test "$image_runs" -ge 1

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tagged_sha=$tagged_sha" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve qualified commit image
        id: candidate
        run: |
          source_digest=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:sha-${{ steps.release.outputs.tagged_sha }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "source_digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Verify exact image contents and release metadata
        run: |
          image="$IMAGE_REPOSITORY@${{ steps.candidate.outputs.source_digest }}"
          docker pull "$image"
          scripts/control_plane_image_contract.sh \
            "$image" \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.tagged_sha }}"

      - name: Verify provenance identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAGGED_SHA: ${{ steps.release.outputs.tagged_sha }}
        run: |
          gh attestation verify \
            "oci://$IMAGE_REPOSITORY@${{ steps.candidate.outputs.source_digest }}" \
            --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/control-plane-image.yml" \
            --source-ref refs/heads/main \
            --source-digest "$TAGGED_SHA" \
            --predicate-type https://slsa.dev/provenance/v1

      - name: Verify SBOM attestation identity
        env:
          GH_TOKEN: ${{ github.token }}
          TAGGED_SHA: ${{ steps.release.outputs.tagged_sha }}
        run: |
          gh attestation verify \
            "oci://$IMAGE_REPOSITORY@${{ steps.candidate.outputs.source_digest }}" \
            --bundle-from-oci \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/control-plane-image.yml" \
            --source-ref refs/heads/main \
            --source-digest "$TAGGED_SHA" \
            --predicate-type https://spdx.dev/Document/v2.3

      - name: Enforce vulnerability-exception review date
        run: scripts/check_grype_exceptions.sh

      - name: Scan exact release image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.IMAGE_REPOSITORY }}@${{ steps.candidate.outputs.source_digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          grype-version: v0.116.0
          config: security/control-plane-grype.yaml

      - name: Check immutable release destinations
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .release-workflow/scripts/check_control_plane_release_destinations.sh \
            "$IMAGE_REPOSITORY" \
            "$RELEASE_TAG" \
            "${{ steps.candidate.outputs.source_digest }}" \
            "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Promote qualified commit image without rebuilding
        if: steps.existing.outputs.registry_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + ":" + .object.sha')
          [[ "$remote_tag_object" == tag:* ]]
          tag_object_sha=${remote_tag_object#tag:}
          tag_record=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          test "$(jq -r '.verification.verified' <<< "$tag_record")" = true
          test "$(jq -r '.object.sha' <<< "$tag_record")" = "${{ steps.release.outputs.tagged_sha }}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE_REPOSITORY:$RELEASE_TAG" \
            "$IMAGE_REPOSITORY@${{ steps.candidate.outputs.source_digest }}"
          digest=$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test "$digest" = "${{ steps.candidate.outputs.source_digest }}"

      - name: Publish GitHub release
        if: steps.existing.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + ":" + .object.sha')
          [[ "$remote_tag_object" == tag:* ]]
          tag_object_sha=${remote_tag_object#tag:}
          tag_record=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")
          test "$(jq -r '.verification.verified' <<< "$tag_record")" = true
          test "$(jq -r '.object.sha' <<< "$tag_record")" = "${{ steps.release.outputs.tagged_sha }}"
          printf -v notes 'Control-plane deployment reference: `%s@%s`\n\nFavn control-plane security channel: supported' \
            "$IMAGE_REPOSITORY" \
            "${{ steps.candidate.outputs.source_digest }}"
          args=("$RELEASE_TAG" --verify-tag --generate-notes --notes "$notes")
          if [[ "${RELEASE_TAG#v}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"
